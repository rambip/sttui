[project]
name = "sttui"
version = "0.3.0a4"
description = "Linux-first speech-to-text terminal UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sttui contributors" }]
dependencies = [
  "clipboard>=0.0.4",
  "notify-py>=0.3.43",
  "requests>=2.31.0",
  "sounddevice>=0.4.7",
  "textual>=0.79.0",
  "pytest>=8.0.0",
  "numpy>=2.4.3",
  "setuptools>=82.0.1",
  "pynput>=1.8.1",
]

[project.scripts]
sttui = "sttui.cli:main"

[project.optional-dependencies]
ydotool = [
  "python-ydotool>=1.1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sttui = ["*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
